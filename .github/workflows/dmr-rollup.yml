name: DMR Baseline Coverage Rollup

on:
  push:
    branches:
      - main
    paths:
      - 'design-status/**/runs/**'
  schedule:
    - cron: '0 2 * * *'  # Daily at 02:00 UTC
  workflow_dispatch:
    inputs:
      page_id:
        description: 'Confluence Design Page ID to rollup'
        required: true
        default: '123456'

concurrency:
  group: dmr-rollup-${{ github.event.inputs.page_id || 'default' }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  rollup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Deterministic Rollup
        run: |
          PAGE_ID="${{ github.event.inputs.page_id || '123456' }}"
          echo "Running DMR Rollup for Confluence Page: $PAGE_ID"
          python .github/skills/design-maturity-reviewer/scripts/rollup.py --page-id "$PAGE_ID"

      - name: Commit Coverage Report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          PAGE_ID="${{ github.event.inputs.page_id || '123456' }}"
          git add "design-status/$PAGE_ID/COVERAGE.md"
          if git diff --staged --quiet; then
            echo "No coverage changes detected."
          else
            git commit -m "chore(dmr): regenerate design coverage for page $PAGE_ID [skip ci]"
            git push origin main
          fi
